name: ListingView360 Frontend Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test src/utils/favorites.test.ts
      - run: npm run lint
      - run: npm run build
      - name: Production smoke test (public routes and admin protection)
        if: github.event_name == 'pull_request'
        run: node scripts/smoke-production.mjs
